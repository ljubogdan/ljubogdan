    <text x="62" y="168" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="#F2F4F8">Bogdan Ljubinković</text>
    <rect x="64" y="192" width="132" height="5" rx="2.5" fill="url(#g)" />
    <text x="64" y="240" class="sans" font-size="24" font-weight="500" fill="#F2F4F8">Building things worth using</text>

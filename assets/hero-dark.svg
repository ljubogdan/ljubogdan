<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Bogdan Ljubinković. Software engineering student in Novi Sad. Building things worth using with people worth building with.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C9CFF" />
      <stop offset="1" stop-color="#C08CFF" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7C9CFF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#7C9CFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0D12" stop-opacity="1" />
      <stop offset="0.55" stop-color="#0B0D12" stop-opacity="0.6" />
      <stop offset="1" stop-color="#0B0D12" stop-opacity="0" />
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="18" /></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .n { fill: #7C9CFF; animation: pulse 3.2s ease-in-out infinite; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .n, .cur { animation: none; } }
    </style>
  </defs>
